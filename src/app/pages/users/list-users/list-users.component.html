<mat-grid-list cols="1" *ngIf="!listUsers; else divList">
<mat-grid-tile>
    <mat-spinner></mat-spinner>
</mat-grid-tile>
</mat-grid-list>

<ng-template #divList>
    <div fxLayoutAlign="center">
        <mat-card>
            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
        
                <ng-container matColumnDef="iduser">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> ID </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.iduser}} </mat-cell>
                </ng-container>
        
                <ng-container matColumnDef="firstname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.firstname}} </mat-cell>
                </ng-container>
        
                <ng-container matColumnDef="secondname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Segundo Nombre </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.secondname}} </mat-cell>
                </ng-container>
        
                <ng-container matColumnDef="lastname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Apellido </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.lastname}} </mat-cell>
                </ng-container>
        
                <ng-container matColumnDef="surname">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Apellido Materno </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.surname}} </mat-cell>
                </ng-container>
    
                <ng-container matColumnDef="editar">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Editar </mat-header-cell>
                    <mat-cell *matCellDef="let element"> <button mat-icon-button color="primary"><mat-icon>edit</mat-icon>
                        </button></mat-cell>
                </ng-container>
    
                <ng-container matColumnDef="eliminar">
                    <mat-header-cell *matHeaderCellDef mat-sort-header> Eliminar </mat-header-cell>
                    <mat-cell *matCellDef="let element"> <button mat-icon-button color="warn"><mat-icon>delete</mat-icon>
                        </button></mat-cell>
                </ng-container>
    
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" class="row"></mat-row>
            </table>
        </mat-card>
    </div>
</ng-template>

<div fxLayout="row wrap" fxLayout.xs="column" fxLayoutAlign="center" fxLayoutGap="20px">

    <div fxFlex="20" fxFlex.lg="15" fxFlex.sm="30" *ngFor="let x of listUsers" class="example-card">

        <mat-card>
            <mat-card-header>
                <img mat-card-avatar [src]="x | imagen" class="example-header-image">
                <mat-card-title> {{x.firstname}} </mat-card-title>
                <mat-card-subtitle> {{x.lastname}} </mat-card-subtitle>
            </mat-card-header>
            <img mat-card-image [src]="x | imagen">
            <mat-card-content>
                <p>
                    The Shiba Inu is the smallest of the six original.
                </p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button>LIKE</button>
                <button mat-button>SHARE</button>
            </mat-card-actions>
        </mat-card>

    </div>

</div>
